theme = "catppuccin_mocha"

[editor]
scrolloff = 10
line-number = "relative"
cursorline = true
# autoinfo = false
true-color = true
color-modes = true
trim-trailing-whitespace = true

[editor.statusline]
left = ["mode", "file-name", "read-only-indicator", "file-modification-indicator"]
right = ["diagnostics", "separator", "selections", "separator", "position", "position-percentage"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.soft-wrap]
enable = true
max-wrap = 0
