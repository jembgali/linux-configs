# theme.toml

[flavor]
dark = "catppuccin-mocha"

[app]

[mgr]
cwd = { fg = "#a6e3a1" }

[indicator]
parent = { fg = "#1e1e2e", bg = "#cdd6f4", bold = true }
current = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
preview = { fg = "#1e1e2e", bg = "#cdd6f4", bold = true }

[tabs]
active   = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
inactive = { fg = "#f5e0dc" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#cba6f7", bold = true }
normal_alt  = { fg = "#f5e0dc" }

select_main = { fg = "#cba6f7", bold = true }
select_alt  = { fg = "#f5e0dc" }

unset_main = { fg = "#cba6f7", bold = true }
unset_alt  = { fg = "#f5e0dc" }

[status]
sep_left  = { open = "|", close = "|" }
sep_right = { open = "|", close = "|" }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#a6e3a1", bg = "#45475a" }
progress_error  = { fg = "#f9e2af", bg = "#f38ba8" }

perm_type  = { fg = "#89b4fa" }
perm_read  = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec  = { fg = "#a6e3a1" }
perm_sep   = { fg = "#7f849c" }

[which]

[confirm]

[spot]

[notify]

[pick]

[input]

[cmp]

[tasks]

[help]

[filetype]

